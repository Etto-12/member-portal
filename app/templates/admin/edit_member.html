{% extends "layout/base.html" %}
{% block content %}

<style>
  .edit-member-wrapper {
    max-width: 1100px;
    margin: 30px auto;
  }

  .edit-member-card {
    border-radius: 14px;
    border: none;
    padding: 30px 40px;
    background: white;
  }

  .form-row {
    display: grid;
    grid-template-columns: 220px 1fr;
    align-items: center;
    gap: 12px 20px;
    margin-bottom: 14px;
  }

  .form-row label {
    font-weight: 600;
    font-size: 0.9rem;
    color: #333;
    text-align: right;
  }

  .form-row input,
  .form-row select,
  .form-row textarea {
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 0.95rem;
    width: 100%;
    border: 1px solid #d1d5db;
  }

  .form-row input[readonly] {
    background-color: #f1f3f5;
  }

  .form-actions {
    margin-top: 25px;
    text-align: center;
  }

  .form-actions .btn-primary {
    background-color: #6f42c1;
    border: none;
    padding: 10px 26px;
    border-radius: 8px;
    font-weight: 600;
    color: white;
  }

  .form-actions .btn-primary:hover {
    background-color: #5a32a3;
  }

  @media (max-width: 768px) {
    .form-row {
      grid-template-columns: 1fr;
    }
    .form-row label {
      text-align: left;
    }
  }
</style>

<div class="edit-member-wrapper">
  <h3 class="text-center mb-4">Edit Member</h3>

  <form method="POST">
    <div class="edit-member-card shadow-sm">

      <!-- IC -->
      <div class="form-row">
        <label>IC Number</label>
        <input value="{{ member.ic }}" readonly>
      </div>

      <div class="form-row">
        <label>No ID</label>
        <input name="noid" value="{{ member.noid or '' }}">
      </div>

      <div class="form-row">
        <label>Title</label>
        <input name="title" value="{{ member.title or '' }}">
      </div>

      <div class="form-row">
        <label>Full Name</label>
        <input name="fullname" value="{{ member.fullname or '' }}">
      </div>

      <div class="form-row">
        <label>Jantina</label>
        <select name="jantina">
          <option value="">Select</option>
          <option value="L" {% if member.jantina == 'L' %}selected{% endif %}>Lelaki</option>
          <option value="P" {% if member.jantina == 'P' %}selected{% endif %}>Perempuan</option>
        </select>
      </div>

      <!-- PARLIMEN -->
      <div class="form-row">
        <label>Parlimen</label>
        <select id="parlimenSelect" name="parlimen">
          <option value="">Select</option>
          {% for p in parlimens %}
            <option value="{{ p.name }}"
                    data-id="{{ p.id }}"
                    {% if p.name == member.parlimen %}selected{% endif %}>
              {{ p.name }}
            </option>
          {% endfor %}
        </select>
      </div>

      <!-- DAERAH -->
      <div class="form-row">
        <label>Daerah</label>
        <select id="daerahSelect" name="daerah_id">
          <option value="">Select</option>
          {% for d in daerahs %}
            <option value="{{ d.id }}"
              {% if member.daerah_id == d.id %}selected{% endif %}>
              {{ d.name }}
            </option>
          {% endfor %}
        </select>
      </div>

      <!-- DUN (RELATIONAL, FIXED) -->
      <div class="form-row">
        <label>DUN</label>
        <select id="dunSelect" name="dun_id">
          <option value="">Select</option>
          {% for d in duns %}
            <option value="{{ d.id }}"
              {% if member.dun_id == d.id %}selected{% endif %}>
              {{ d.name }}
            </option>
          {% endfor %}
        </select>
      </div>

      <!-- BAHAGIAN -->
      <div class="form-row">
        <label>Bahagian</label>
        <select name="bahagian_id">
          <option value="">Select</option>
          {% for b in bahagians %}
            <option value="{{ b.id }}"
              {% if member.bahagian_id == b.id %}selected{% endif %}>
              {{ b.name }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="form-row">
        <label>Cawangan</label>
        <input name="cawangan" value="{{ member.cawangan or '' }}">
      </div>

      <div class="form-row">
        <label>Tarikh Lahir</label>
        <input type="date" name="birthdate"
               value="{{ member.birthdate.strftime('%Y-%m-%d') if member.birthdate }}">
      </div>

      <div class="form-row">
        <label>Warganegara</label>
        <input name="warganegara" value="{{ member.warganegara or '' }}">
      </div>

      <div class="form-row">
        <label>No Telefon</label>
        <input name="notelefon" value="{{ member.notelefon or '' }}">
      </div>

      <div class="form-row">
        <label>Email</label>
        <input name="emel" value="{{ member.emel or '' }}">
      </div>

      <div class="form-row">
        <label>Status Ahli</label>
        <input name="memberstatus" value="{{ member.memberstatus or '' }}">
      </div>

      <div class="form-row">
        <label>Alamat</label>
        <textarea name="alamat">{{ member.alamat or '' }}</textarea>
      </div>

      <div class="form-actions">
        <button class="btn-primary">Update Member</button>
        <a href="{{ url_for('admin.members') }}" class="btn btn-link">Cancel</a>
      </div>

    </div>
  </form>
</div>

<script>
const parlimenSelect = document.getElementById("parlimenSelect");
const daerahSelect = document.getElementById("daerahSelect");
const dunSelect = document.getElementById("dunSelect");

function resetSelect(sel){
  sel.innerHTML = '<option value="">Select</option>';
}

parlimenSelect.addEventListener("change", async () => {
  resetSelect(daerahSelect);
  resetSelect(dunSelect);

  const pid = parlimenSelect.selectedOptions[0]?.dataset.id;
  if (!pid) return;

  const res = await fetch(`/admin/api/daerahs?parlimen_id=${pid}`);
  const rows = await res.json();

  rows.forEach(r => {
    daerahSelect.append(new Option(r.name, r.id));
  });
});

daerahSelect.addEventListener("change", async () => {
  resetSelect(dunSelect);

  const did = daerahSelect.value;
  if (!did) return;

  const res = await fetch(`/admin/api/duns?daerah_id=${did}`);
  const rows = await res.json();

  rows.forEach(r => {
    dunSelect.append(new Option(r.name, r.id));
  });
});
</script>

{% endblock %}
