<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPKO Member Portal – Login</title>

  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/upko.png') }}">
  <link rel="shortcut icon" type="image/png" href="{{ url_for('static', filename='img/upko.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/upko.png') }}">

  <style>
    :root {
      --brand-blue: #234a93;
      --brand-blue-dark: #13294f;
      --brand-blue-soft: #eaf1ff;
      --brand-red: #d91c29;
      --brand-red-soft: #fff1f2;
      --text: #0f172a;
      --muted: #64748b;
      --line: #dbe4f0;
      --card-bg: rgba(255,255,255,0.94);
      --shadow: 0 24px 60px rgba(15, 23, 42, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(35,74,147,0.18), transparent 32%),
        radial-gradient(circle at bottom right, rgba(217,28,41,0.12), transparent 30%),
        linear-gradient(135deg, #eef4fb 0%, #f7f9fd 45%, #eef3fa 100%);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .bg-logo {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.045;
    }

    .bg-logo img {
      width: min(620px, 70vw);
      max-width: 70vw;
      filter: saturate(0.9);
    }

    .login-shell {
      width: 100%;
      max-width: 430px;
      position: relative;
      z-index: 1;
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.65);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-topbar {
      height: 7px;
      background: linear-gradient(90deg, var(--brand-blue), #3c67bc, var(--brand-red));
    }

    .card-body {
      padding: 32px 30px 28px;
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
    }

    .logo-badge {
      width: 92px;
      height: 92px;
      border-radius: 26px;
      background: linear-gradient(180deg, #ffffff 0%, #eef4ff 100%);
      border: 1px solid #dbe4f3;
      box-shadow: 0 18px 32px rgba(35, 74, 147, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .logo-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .login-title {
      text-align: center;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0;
      color: var(--brand-blue-dark);
    }

    .login-subtitle {
      text-align: center;
      margin: 8px 0 24px;
      color: var(--muted);
      font-size: 0.96rem;
    }

    .flash-wrap {
      margin-bottom: 14px;
    }

    .flash {
      padding: 12px 14px;
      border-radius: 14px;
      margin-bottom: 10px;
      font-weight: 700;
      border: 1px solid transparent;
      font-size: 0.92rem;
    }

    .flash.success {
      background: #ecfdf3;
      border-color: #bbf7d0;
      color: #166534;
    }

    .flash.danger {
      background: #fef2f2;
      border-color: #fecaca;
      color: #991b1b;
    }

    .flash.warning {
      background: #fff7ed;
      border-color: #fed7aa;
      color: #9a3412;
    }

    .flash.info {
      background: #eff6ff;
      border-color: #bfdbfe;
      color: #1d4ed8;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      margin-bottom: 7px;
      font-size: 0.84rem;
      font-weight: 700;
      color: #334155;
      letter-spacing: 0.01em;
    }

    .form-input {
      width: 100%;
      height: 50px;
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 0 15px;
      font-size: 0.96rem;
      background: rgba(255,255,255,0.95);
      color: var(--text);
      transition: all 0.18s ease;
    }

    .form-input:hover {
      border-color: #c7d4e7;
    }

    .form-input:focus {
      outline: none;
      border-color: #4b63c6;
      box-shadow: 0 0 0 4px rgba(35, 74, 147, 0.12);
    }

    .login-btn {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 15px;
      background: linear-gradient(135deg, var(--brand-blue), #4a5fe2);
      color: white;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.01em;
      cursor: pointer;
      box-shadow: 0 14px 28px rgba(35, 74, 147, 0.22);
      transition: transform 0.16s ease, filter 0.16s ease;
      margin-top: 6px;
    }

    .login-btn:hover {
      filter: brightness(1.03);
      transform: translateY(-1px);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .footer-note {
      text-align: center;
      margin-top: 18px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    @media (max-width: 560px) {
      body {
        padding: 16px;
      }

      .card-body {
        padding: 24px 18px 22px;
      }

      .logo-badge {
        width: 82px;
        height: 82px;
      }

      .login-title {
        font-size: 1.7rem;
      }
    }
  </style>
</head>
<body>
  <div class="bg-logo">
    <img src="{{ url_for('static', filename='img/upko.png') }}" alt="UPKO background logo">
  </div>

  <div class="login-shell">
    <div class="login-card">
      <div class="card-topbar"></div>

      <div class="card-body">
        <div class="logo-wrap">
          <div class="logo-badge">
            <img src="{{ url_for('static', filename='img/upko.png') }}" alt="UPKO logo">
          </div>
        </div>

        <h1 class="login-title">UPKO Member Portal</h1>
        <div class="login-subtitle">Admin &amp; Staff Login</div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flash-wrap">
              {% for category, message in messages %}
                <div class="flash {{ category if category in ['success', 'danger', 'warning'] else 'info' }}">
                  {{ message }}
                </div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST">
          <div class="form-group">
            <label class="form-label">Username</label>
            <input class="form-input" type="text" name="username" placeholder="Enter username" required>
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <input class="form-input" type="password" name="password" placeholder="Enter password" required>
          </div>

          <button class="login-btn" type="submit">Login</button>
        </form>

        <div class="footer-note">
          Secure internal access for authorised users only.
        </div>
      </div>
    </div>
  </div>
</body>
</html>
